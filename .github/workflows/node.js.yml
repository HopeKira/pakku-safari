name: Publication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned secret scanner
        shell: bash
        run: |
          mkdir -p .security-tools
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .security-tools/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .security-tools/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .security-tools/gitleaks.tar.gz -C .security-tools gitleaks
      - run: npm ci --ignore-scripts --no-audit
      - run: GITLEAKS_BIN="$PWD/.security-tools/gitleaks" sh scripts/security-check.sh
      - run: npm run build:safari
      - run: npm run build:chrome
      - run: npm run build:firefox
      - run: npm run build:edg
